[project]
name = "solidity-diff-agent"
version = "0.1.0"
description = "AI-in-the-loop bug hunter driving the solidity-diff oracle (solc vs solang)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.28.1",
    "openai>=1.0",
    "solidity-diff-oracle",
]

[project.scripts]
solidity-diff-agent = "agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv.sources]
solidity-diff-oracle = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that spawn chain nodes (require devshell binaries)",
]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # long lines: prompt templates and JSON blobs
    "E501",
]
