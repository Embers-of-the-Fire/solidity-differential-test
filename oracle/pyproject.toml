[project]
name = "solidity-diff-oracle"
version = "0.1.0"
description = "On-chain differential testing oracle for Solidity compilers (solc vs solang)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "web3>=7.0",
    "substrate-interface>=1.8",
]

[project.scripts]
solidity-diff-oracle = "oracle.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # chain adapters deliberately catch everything: the oracle must record
    # unexpected node/compiler behavior as data, never crash on it
    "B904",
    "E501",  # long lines: JSON templates and shell commands
]

